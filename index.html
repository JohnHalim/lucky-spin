<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070718">
  <title>Lucky Spin — جرّب حظك! 🎡</title>
  <!-- خط Cairo خفيف، ولو اتحجب الصفحة بتشتغل بخط النظام -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="title">🎁 جرب حظك! - اهداء اسرة البطاركه</h1>
    <p class="subtitle">لف العجلة وشوف هديتك إيه 👀</p>

    <!-- العجلة: الإطار والمؤشر ثابتين، و #wheel هو اللي بيلف -->
    <div class="wheel-wrap" id="wheelWrap">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel" id="wheel" aria-hidden="true"></div>
      <div class="hub" aria-hidden="true">⭐</div>
    </div>

    <button id="spinBtn" class="spin-btn" type="button">🎡 لف العجلة!</button>
    <p class="hint">مستعد للمفاجأة؟</p>
    <p class="note">🎮 هديه ليك من اسرة البطاركه</p>
  </main>

  <!-- نافذة النتيجة -->
  <div class="modal" id="modal" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="m-icon" id="mIcon"></div>
      <h2 id="mTitle"></h2>
      <p class="m-prize" id="mPrize"></p>
      <p class="m-msg" id="mMsg"></p>
      <!-- الرابط ثابت وبيفتح بس لما الطالب يضغط -->
      <a class="btn-main" id="formBtn" target="_blank" rel="noopener noreferrer"
         href="https://docs.google.com/forms/d/e/1FAIpQLSfUn3bbLmUzXS0cmkemWzZulW7BLDbiKP5KCLHNnOR8ctQ1iA/viewform?usp=send_form">استلام الجائزه 🚀</a>
      <button class="btn-alt" id="againBtn" type="button">🔁 لف تاني</button>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="script.js"></script>
</body>
</html>
